
# netlify.toml
# This file configures your Netlify deployment

[build]
  # Directory where your built files will be output
  publish = "dist"
  
  # Command to build your site
  command = "npm run build"
  
  # Root directory of your project (leave empty or "." for repository root)
  base = "."

# This sets up redirects for single-page applications
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
